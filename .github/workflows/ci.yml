name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Astro check
        run: npm run check

      - name: Build project
        run: npm run build

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: quality

    # Solo publicamos imágenes cuando hacemos push a main.
    # En un pull request solo ejecutamos las validaciones.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/r0ger130296/me_astro:latest \
            -t ghcr.io/r0ger130296/me_astro:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/r0ger130296/me_astro:latest
          docker push ghcr.io/r0ger130296/me_astro:${{ github.sha }}