name: Deploy Local

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to local WSL
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Show workflow info
        run: |
          echo "Triggered by workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Pull latest image from GHCR
        run: |
          docker pull ghcr.io/r0ger130296/me_astro:latest

      - name: Remove previous container
        run: |
          docker rm -f me-astro || true

      - name: Start new container
        run: |
          docker run -d \
            --name me-astro \
            --restart unless-stopped \
            -p 8080:80 \
            ghcr.io/r0ger130296/me_astro:latest

      - name: Verify deployment
        run: |
          sleep 5
          curl --fail http://localhost:8080